# The release of frc to PyPI, copied from examples/pypi-release.yml in
# touchgate. `touchgate start` starts it when a merge brings in an approval,
# and the copy on `publish` runs. PyPI trusts this file in the `release`
# environment.
name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The merge commit of the release, on the default branch
        required: true
        type: string

permissions: {}

env:
  # The public key that approves a release.
  TOUCHGATE_KEY: sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29tAAAAIPK8VZox0UVPB1gsQowDPXlOj1Z34IIJ3V4I2chFNYONAAAAC3NzaDpzaWduaW5n release key
  # The uv that builds and uploads the release. setup-uv checks it against
  # the checksum it knows for this version. A package built with uv_build
  # builds with the copy in this uv, which `touchgate check --build` checks.
  UV_VERSION: 0.13.6

jobs:
  # Checks the approval before anything from the commit runs. touchgate is
  # installed before the checkout and reads the commit with git only.
  verify:
    name: Check the approval
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch the default branch
    steps:
      - uses: borink-org/touchgate/install@f40941fdd1c86e6ed277b3870aaafdb891251dbe # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # touchgate reads the commit, the default branch and the commit of this
      # workflow from the run, and the key from TOUCHGATE_KEY.
      - run: touchgate verify

  # The commit is approved from here on, so building it is safe. The build
  # runs in a job that cannot get a PyPI token.
  build:
    name: Build the release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the release
    steps:
      - uses: borink-org/touchgate/install@f40941fdd1c86e6ed277b3870aaafdb891251dbe # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: touchgate check --build
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  # Publishes only once every check on the merge commit has passed.
  checks:
    name: Wait for the merge's checks
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      checks: read # to read the merge commit's check runs
    steps:
      - uses: borink-org/touchgate/install@f40941fdd1c86e6ed277b3870aaafdb891251dbe # v0.1.0
      - run: touchgate wait-for-checks
        env:
          GH_TOKEN: ${{ github.token }}

  # Builds nothing from the commit. touchgate checks that the built files
  # are of this version, signs their attestations and uploads them.
  publish:
    name: Publish to PyPI
    needs: [build, checks]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: touchgate-publish
      cancel-in-progress: false
    permissions:
      contents: read # to check out the release
      id-token: write # for PyPI trusted publishing and the attestations
    steps:
      - uses: borink-org/touchgate/install@f40941fdd1c86e6ed277b3870aaafdb891251dbe # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: touchgate publish dist

  # This job runs last, so a tag always names a published release.
  github-release:
    name: Tag and release on GitHub
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    steps:
      - uses: borink-org/touchgate/install@f40941fdd1c86e6ed277b3870aaafdb891251dbe # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: touchgate github-release dist/*
        env:
          GH_TOKEN: ${{ github.token }}
