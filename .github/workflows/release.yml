# The release, started by the touchgate workflow once a merge brings in an
# approval. The copy on the publish branch is the one that runs and the one
# PyPI trusts; see docs/RELEASING.md.
#
# Every step that does more than build or upload is a touchgate command. The
# job that publishes is defined here, not in a reusable workflow, because PyPI
# trusts this file in the `release` environment and the attestations name it.
name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The merge commit of the release, on the default branch
        required: true
        type: string

permissions: {}

env:
  # The touchgate commit the release runs, installed in each job that runs it.
  TOUCHGATE_REV: f6da2508d930df3bb712ab2132c26f9adf001ec0
  TOUCHGATE_KEY: sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29tAAAAIPK8VZox0UVPB1gsQowDPXlOj1Z34IIJ3V4I2chFNYONAAAAC3NzaDpzaWduaW5n release key
  # The uv that builds and uploads the release, checked against the checksum
  # setup-uv knows for it. A package built with uv_build builds with the copy
  # in this uv, which `touchgate check-backend` checks.
  UV_VERSION: 0.13.6

jobs:
  # Checks the approval without running anything from the commit: touchgate
  # is built before the checkout, and reads the commit with git alone.
  verify:
    name: Check the approval
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch the default branch
    steps:
      - name: Install touchgate
        working-directory: ${{ runner.temp }}
        run: cargo install --locked --git https://github.com/borink-org/touchgate --rev "$TOUCHGATE_REV" touchgate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the approval
        env:
          COMMIT: ${{ inputs.commit }}
          BRANCH: origin/${{ github.event.repository.default_branch }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: >-
          touchgate verify --repo . --commit "$COMMIT" --branch "$BRANCH"
          --key "$TOUCHGATE_KEY" --workflow-commit "$WORKFLOW_COMMIT"

  # The commit is approved from here on, so building it is safe. The build
  # runs apart from the job that can get a PyPI token.
  build:
    name: Build the release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the release
    steps:
      - name: Install touchgate
        working-directory: ${{ runner.temp }}
        run: cargo install --locked --git https://github.com/borink-org/touchgate --rev "$TOUCHGATE_REV" touchgate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: touchgate check
      - run: touchgate check-backend
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  # Publishes only once every check on the merge commit has passed.
  checks:
    name: Wait for the merge's checks
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      checks: read # to read the merge commit's check runs
    steps:
      - name: Install touchgate
        working-directory: ${{ runner.temp }}
        run: cargo install --locked --git https://github.com/borink-org/touchgate --rev "$TOUCHGATE_REV" touchgate
      - name: Wait for every check on the merge to pass
        env:
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: touchgate wait-for-checks --commit "$COMMIT"

  # Builds nothing from the commit: it checks the built files are this
  # version's, signs their attestations and uploads them.
  publish:
    name: Publish to PyPI
    needs: [build, checks]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: touchgate-publish
      cancel-in-progress: false
    permissions:
      contents: read # to check out the release
      id-token: write # for PyPI trusted publishing and the attestations
    steps:
      - name: Install touchgate
        working-directory: ${{ runner.temp }}
        run: cargo install --locked --git https://github.com/borink-org/touchgate --rev "$TOUCHGATE_REV" touchgate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: touchgate publish dist

  # Only now does the tag exist, so a tag always names a published release.
  github-release:
    name: Tag and release on GitHub
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    steps:
      - name: Install touchgate
        working-directory: ${{ runner.temp }}
        run: cargo install --locked --git https://github.com/borink-org/touchgate --rev "$TOUCHGATE_REV" touchgate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Tag the release and make a GitHub release
        env:
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: touchgate github-release --commit "$COMMIT" dist/*
