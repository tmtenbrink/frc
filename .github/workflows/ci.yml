name: CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  buildtest:
    name: Build-Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
          py-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.py-version }}
      - name: uv sync
        run: uv sync --locked
      - name: Test lowest versions
        if: ${{ matrix.py-version == '3.10' }}
        run: uv pip install numpy==1.21.3 scipy==1.7.3 diplib==3.2.0 rustfrc==1.2.0
      - name: Pytest
        run: uv run --no-sync pytest
      - name: Build
        run: uv build
