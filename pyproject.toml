[project]
name = "frc"
version = "0.1.3"
description = "Library for computing Fourier Ring Correlation (FRC) curves and using them to determine image resolution."
authors = [
    {name = "Tip ten Brink", email = "tip@tenbrinkmeijs.com"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8, <3.13"
dependencies = [
    # Newer diplib releases claim to support these Python versions but have no wheels for them
    "diplib >= 3.1.0, < 3.5; python_version < '3.9'",
    "diplib >= 3.1.0, < 3.5.2; python_version == '3.9'",
    "diplib >= 3.1.0, < 3.6; python_version == '3.10'",
    "diplib >= 3.1.0; python_version >= '3.11'",
    "scipy >= 1.3.2; python_version < '3.12'",
    "scipy >= 1.11.2; python_version >= '3.12'",
    "numpy >= 1.18; python_version < '3.12'",
    "numpy >= 1.26; python_version >= '3.12'",
    "rustfrc >= 1.1.5",
]

[project.urls]
"Source Code" = "https://github.com/tiptenbrink/frc"

[dependency-groups]
dev = [
    "pytest >= 9.0.3; python_version >= '3.10'",
    "pytest >= 8.4.2; python_version == '3.9'",
    "pytest >= 8.3.5; python_version < '3.9'",
]

[build-system]
requires = ["uv_build >= 0.13.5, < 0.14"]
build-backend = "uv_build"

[tool.uv]
# Resolve to versions with wheels on the platforms CI and most users run on
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
