[project]
name = "frc"
version = "0.1.3"
description = "Library for computing Fourier Ring Correlation (FRC) curves and using them to determine image resolution."
authors = [
    {name = "Tip ten Brink", email = "tip@tenbrinkmeijs.com"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10, <3.15"
# Each floor is the oldest release with wheels for that Python on Linux x86_64,
# macOS arm64 and Windows. DIPlib has no wheels for Python 3.15 yet, hence the
# cap, and none of 3.6 for Python 3.10, though it claims to support it.
dependencies = [
    "diplib >= 3.2.0, < 3.6; python_version == '3.10'",
    "diplib >= 3.4.0; python_version == '3.11'",
    "diplib >= 3.4.1; python_version == '3.12'",
    "diplib >= 3.5.2; python_version == '3.13'",
    "diplib >= 3.6.0; python_version >= '3.14'",
    "scipy >= 1.7.3; python_version == '3.10'",
    "scipy >= 1.9.2; python_version == '3.11'",
    "scipy >= 1.11.2; python_version == '3.12'",
    "scipy >= 1.14.1; python_version == '3.13'",
    "scipy >= 1.16.1; python_version >= '3.14'",
    "numpy >= 1.21.3; python_version == '3.10'",
    "numpy >= 1.23.2; python_version == '3.11'",
    "numpy >= 1.26.0; python_version == '3.12'",
    "numpy >= 2.1.0; python_version == '3.13'",
    "numpy >= 2.3.2; python_version >= '3.14'",
    "rustfrc >= 1.2.0",
]

[project.urls]
"Source Code" = "https://github.com/tiptenbrink/frc"

[dependency-groups]
dev = [
    "pytest >= 9.0.3",
]

[build-system]
requires = ["uv_build >= 0.13.5, < 0.14"]
build-backend = "uv_build"

[tool.uv]
# Resolve to versions with wheels on the platforms CI and most users run on
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
